# Render Blueprint: deploys the FastAPI backend and the React frontend.
# Render Dashboard -> New -> Blueprint -> pick this repo. Secret values are
# prompted for (sync: false); set CORS_ORIGINS and VITE_API_URL after the first deploy.
services:
  - type: web
    name: civicfix-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_REASONING_EFFORT
        value: none

  - type: web
    name: civicfix-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
